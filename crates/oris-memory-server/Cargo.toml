[package]
name = "oris-memory-server"
version = "0.1.0"
edition = "2021"
description = "HTTP + MCP server for Oris Enterprise Context & Memory Service"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Colin4k1024/oris-memory-server"
documentation = "https://docs.rs/oris-memory-server"
keywords = ["oris", "memory", "server", "mcp", "context"]

[dependencies]
oris-control-plane = { path = "../oris-control-plane" }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "io-util", "io-std"] }
serde_json = "1.0"
anyhow = "1.0"
