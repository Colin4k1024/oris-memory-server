# Oris Memory Server — standalone workspace.
# Extracted from the Oris monorepo as a self-contained product.
[workspace]
resolver = "2"
members = [
    "crates/oris-control-plane",
    "crates/oris-memory-contract",
    "crates/oris-memory-store",
    "crates/oris-memory-server",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
